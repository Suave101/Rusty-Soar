[package]
name = "rusty-soar"
version = "1.0.0"
edition = "2021"
authors = ["Alexander Doyle <adoyle2025@my.fit.edu>"]
description = "A certifiable, zero-GC, `#![no_std]` Rust implementation of the Soar cognitive engine."
license = "MIT OR Apache-2.0"
repository = "https://github.com/suave101/rusty-soar"
readme = "README.md"
keywords = ["soar", "no_std", "ai-safety"]
categories = ["embedded", "science"]

[workspace]
members = [
    "crates/rusty-soar-core",
    "crates/formal-soar-verify",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/suave101/rusty-soar"
authors = ["Alexander Doyle <adoyle2025@my.fit.edu>"]

[workspace.dependencies]
slotmap = { version = "1.0", default-features = false }
hashbrown = { version = "0.14", default-features = false, features = ["ahash", "alloc"] }